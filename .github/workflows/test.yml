name: Test Suite

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install GDAL/SpatiaLite
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Run Python tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-key
        run: poetry run pytest --ignore=scripts/tests/test_configure_zappa.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terramedic

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Django backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: terramedic-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Django backend
        working-directory: .
        run: docker run -d --name backend -p 8000:8000 -e DEBUG=false -e SECRET_KEY=ci-test-key -e ALLOWED_HOSTS=localhost,127.0.0.1 -e LOAD_SEED_DATA=true terramedic-backend

      - name: Wait for backend to be ready
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/organizations/ > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          docker logs backend
          exit 1

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: yarn test
