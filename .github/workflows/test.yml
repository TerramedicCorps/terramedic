name: Test Suite

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache GDAL/SpatiaLite apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-geodeps-${{ runner.os }}

      - name: Install GDAL/SpatiaLite
        run: |
          if [ -d ~/apt-cache ]; then
            sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Create local DB directory
        working-directory: backend
        run: mkdir -p db

      - name: Run Python tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-key
        run: poetry run pytest --ignore=scripts/tests/test_configure_zappa.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terramedic

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Django backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          load: true
          tags: terramedic-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Django backend
        working-directory: .
        run: docker run -d --name backend -p 8000:8000 -e DEBUG=false -e SECRET_KEY=ci-test-key -e ALLOWED_HOSTS=localhost,127.0.0.1 -e LOAD_SEED_DATA=true terramedic-backend

      - name: Wait for backend to be ready
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/organizations/ > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          docker logs backend
          exit 1

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: yarn test
