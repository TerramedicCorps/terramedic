name: Test Suite

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Cache GDAL/SpatiaLite apt packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-cache
          key: apt-geodeps-${{ runner.os }}

      - name: Install GDAL/SpatiaLite
        run: |
          if [ -d ~/apt-cache ]; then
            sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Create local DB directory
        working-directory: backend
        run: mkdir -p db

      - name: Run Python tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-key
        run: poetry run pytest --ignore=scripts/tests/test_configure_zappa.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terramedic

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Django backend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: backend
          load: true
          tags: terramedic-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Django backend
        working-directory: .
        run: docker run -d --name backend -p 8000:8000 -e DEBUG=false -e SECRET_KEY=ci-test-key -e ALLOWED_HOSTS=localhost,127.0.0.1 -e LOAD_SEED_DATA=true terramedic-backend

      - name: Wait for backend to be ready
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/organizations/ > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          docker logs backend
          exit 1

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: yarn test
