name: Deploy Backend

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}

    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          missing=()
          [ -z "${{ vars.AWS_ACCOUNT_ID }}" ] && missing+=(AWS_ACCOUNT_ID)
          [ -z "${{ vars.ZAPPA_S3_BUCKET }}" ] && missing+=(ZAPPA_S3_BUCKET)
          [ -z "${{ vars.ZAPPA_ROLE_NAME }}" ] && missing+=(ZAPPA_ROLE_NAME)
          [ -z "${{ vars.VPC_SUBNET_IDS }}" ] && missing+=(VPC_SUBNET_IDS)
          [ -z "${{ vars.VPC_SECURITY_GROUP_IDS }}" ] && missing+=(VPC_SECURITY_GROUP_IDS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub environment variables: ${missing[*]}"
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.DEPLOY_ENV }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: |
          python3 -m pip install --user "poetry==2.1.3"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry install --no-interaction --no-ansi --only main

      - name: Configure Zappa settings
        working-directory: ./backend
        env:
          CI: true
          AWS_REGION: us-east-1
          ZAPPA_S3_BUCKET: ${{ vars.ZAPPA_S3_BUCKET }}
          PRODUCTION_ASSETS_BUCKET: ${{ vars.PRODUCTION_ASSETS_BUCKET }}
          USE_CUSTOM_DOCKER: true
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VPC_SUBNET_IDS: ${{ vars.VPC_SUBNET_IDS }}
          VPC_SECURITY_GROUP_IDS: ${{ vars.VPC_SECURITY_GROUP_IDS }}
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          DJANGO_SECRET_ARN: ${{ secrets.DJANGO_SECRET_ARN }}
          ZAPPA_ROLE_NAME: ${{ vars.ZAPPA_ROLE_NAME }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          poetry run python scripts/configure_zappa.py
          poetry run zappa save-python-settings-file ${{ env.DEPLOY_ENV }}

      - name: Build and push Docker image
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          # Pull geolambda base image from ECR (or build if not cached)
          docker pull $ECR_REGISTRY/geolambda:3.12.2 || \
            bash scripts/build-docker.sh geolambda
          docker tag $ECR_REGISTRY/geolambda:3.12.2 geolambda:3.12.2 || true

          # Build and push application image
          bash scripts/build-docker.sh ${{ env.DEPLOY_ENV }}

      - name: Deploy with Zappa
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/terramedic-${{ env.DEPLOY_ENV }}:latest"
          FUNCTION_NAME="terramedic-${{ env.DEPLOY_ENV }}"

          if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null; then
            echo "Waiting for any in-progress updates to complete..."
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            echo "Updating existing deployment..."
            set +e
            UPDATE_OUTPUT=$(poetry run zappa update ${{ env.DEPLOY_ENV }} --docker-image-uri "$IMAGE_URI" 2>&1)
            UPDATE_STATUS=$?
            set -e
            echo "$UPDATE_OUTPUT"
            if [ $UPDATE_STATUS -ne 0 ]; then
              if echo "$UPDATE_OUTPUT" | grep -qiE 'ResourceConflict|concurrent'; then
                echo "Retrying after concurrent update conflict..."
                aws lambda wait function-updated --function-name "$FUNCTION_NAME"
                poetry run zappa update ${{ env.DEPLOY_ENV }} --docker-image-uri "$IMAGE_URI"
              else
                exit $UPDATE_STATUS
              fi
            fi
          else
            echo "Creating new deployment..."
            poetry run zappa deploy ${{ env.DEPLOY_ENV }} --docker-image-uri "$IMAGE_URI"
          fi

      - name: Run database migrations
        working-directory: ./backend
        run: |
          poetry run zappa manage ${{ env.DEPLOY_ENV }} "migrate --noinput"

      - name: Configure API custom domain
        working-directory: ./backend
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          SHARED_DNS_ROLE_ARN: ${{ vars.SHARED_DNS_ROLE_ARN }}
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
        run: |
          if [ -z "$DOMAIN_NAME" ]; then
            echo "DOMAIN_NAME not set, skipping custom domain setup"
            exit 0
          fi

          # Determine API subdomain by environment
          if [ "${{ env.DEPLOY_ENV }}" = "prod" ]; then
            API_DOMAIN="api.${DOMAIN_NAME}"
          else
            API_DOMAIN="test-api.${DOMAIN_NAME}"
          fi

          # Use Zappa's built-in certify to create/update API Gateway custom domain
          poetry run zappa certify ${{ env.DEPLOY_ENV }} --yes || {
            echo "::warning::zappa certify failed for ${API_DOMAIN} — ACM cert may not be issued yet"
            exit 0
          }

          echo "Custom domain configured: $API_DOMAIN"

          # Create Route53 alias record (cross-account in shared account)
          if [ -z "$SHARED_DNS_ROLE_ARN" ] || [ -z "$ROUTE53_ZONE_ID" ]; then
            echo "::warning::SHARED_DNS_ROLE_ARN or ROUTE53_ZONE_ID not set, skipping DNS record"
            exit 0
          fi

          # Get the regional domain name for the API Gateway custom domain
          REGIONAL_DOMAIN=$(aws apigateway get-domain-name \
            --domain-name "$API_DOMAIN" \
            --query 'regionalDomainName' --output text)
          REGIONAL_ZONE_ID=$(aws apigateway get-domain-name \
            --domain-name "$API_DOMAIN" \
            --query 'regionalHostedZoneId' --output text)

          # Assume dns-manager role in shared account
          CREDS=$(aws sts assume-role \
            --role-arn "$SHARED_DNS_ROLE_ARN" \
            --role-session-name "deploy-dns-${{ env.DEPLOY_ENV }}" \
            --query 'Credentials' --output json)

          export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)
          export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)
          export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)

          # Upsert the A alias record
          aws route53 change-resource-record-sets \
            --hosted-zone-id "$ROUTE53_ZONE_ID" \
            --change-batch "{
              \"Changes\": [{
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"${API_DOMAIN}\",
                  \"Type\": \"A\",
                  \"AliasTarget\": {
                    \"DNSName\": \"${REGIONAL_DOMAIN}\",
                    \"HostedZoneId\": \"${REGIONAL_ZONE_ID}\",
                    \"EvaluateTargetHealth\": true
                  }
                }
              }]
            }"

          echo "DNS record created: $API_DOMAIN → $REGIONAL_DOMAIN"
