version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/terramedic"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Wait before adopting new releases — supply-chain attacks are usually
    # caught/yanked within days of publication.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      include: ["*"]
    # Group development dependencies together
    groups:
      # Keep the vitest family in lockstep across ALL update types, including
      # major. vitest, @vitest/browser and @vitest/coverage-v8 must share the
      # exact same version (the latter two are exact-pinned to vitest in
      # package.json), so a single-package bump breaks the test runner. Listing
      # it first and omitting update-types ensures every vitest bump lands as one
      # coordinated PR instead of separate, coupling-breaking ones.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        patterns:
          - "@storybook/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "eslint*"
          - "prettier*"
          - "playwright"
        update-types:
          - "minor"
          - "patch"
      # Group production dependencies
      production-dependencies:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "flowbite*"
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
      include: ["*"]
