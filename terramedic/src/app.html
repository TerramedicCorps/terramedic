<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Preload critical fonts to reduce FOUT -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/montserrat-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Anyone can heal the planet. Volunteer, donate, or start where you are — Terramedic connects you with effective ways to make a difference."
    />
    <meta
      name="keywords"
      content="warming stripes, volunteer, donate, heal the planet, Terramedic"
    />
    <meta name="author" content="Terramedic Corps" />
    <!-- <meta name="robots" content="index, follow" /> -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph Meta Tags (for social sharing) -->
    <meta property="og:title" content="Terramedic — Turn Awareness into Action" />
    <meta
      property="og:description"
      content="Volunteer, donate, or start where you are. Terramedic connects you with effective ways to make a difference."
    />
    <meta property="og:image" content="https://terramedic.org/images/og-image.jpg" />
    <meta property="og:url" content="https://terramedic.org" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Terramedic — Turn Awareness into Action" />
    <meta
      name="twitter:description"
      content="Volunteer, donate, or start where you are. Terramedic connects you with effective ways to make a difference."
    />
    <meta name="twitter:image" content="https://terramedic.org/images/og-image.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Terramedic",
        "url": "https://terramedic.org",
        "logo": "https://terramedic.org/images/logo.svg",
        "description": "Terramedic turns awareness into action by connecting people who want to heal our planet with meaningful ways to make a difference."
      }
    </script>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>

    <form name="newsletter-signup" netlify hidden>
      <input type="hidden" name="form-name" value="newsletter-signup" />
      <input type="email" name="email" />
    </form>

    <form name="contact-form" netlify hidden>
      <input type="hidden" name="form-name" value="contact-form" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="text" name="organization" />
      <input type="text" name="subject" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
