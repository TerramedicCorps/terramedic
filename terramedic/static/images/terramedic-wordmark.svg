<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 36">
  <defs>
    <style>
      .wordmark {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
    </style>
  </defs>
  <!-- Green cross as the "T" -->
  <svg x="0" y="2" width="24" height="24" viewBox="7 7 26 26">
    <rect x="15" y="7" width="10" height="26" rx="1.5" fill="#2ecc71"/>
    <rect x="7" y="15" width="26" height="10" rx="1.5" fill="#2ecc71"/>
  </svg>
  <!-- Wordmark: "erra" white + "medic" blue -->
  <text x="25" y="27" class="wordmark">
    <tspan fill="white">erra</tspan><tspan fill="#2196f3">medic</tspan>
  </text>
</svg>
