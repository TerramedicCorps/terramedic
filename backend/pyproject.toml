[tool.poetry]
name = "terramedic"
version = "0.1.0"
description = "Terramedic Django Backend"
authors = ["Leila Hadj-Chikh <lhadjchikh@gmail.com>"]
readme = "README.md"
packages = [
    { include = "terramedic" },
]

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0.3"
django-ninja = "^1.5.3"
dj-database-url = "^3.1.2"
django-cors-headers = "^4.9.0"
whitenoise = "^6.9.0"
gunicorn = "^23.0.0"
django-parler = "^2.3"
boto3 = "^1.42.63"
zappa = "^0.61.4"
psycopg = {version = ">=3.2", extras = ["binary"]}
google-analytics-data = "^0.20.0"
anthropic = "^0.89.0"
jsonschema = "^4.26.0"
beautifulsoup4 = "^4.14.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.12"
pytest = "^9.0.3"
pytest-django = "^4.9.0"
pytest-cov = "^6.0.0"
boto3-stubs = "^1.42.63"
mypy = "^1.19.1"
django-stubs = "^5.2.9"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "N", "B", "UP", "ANN", "A", "COM", "C4", "DTZ", "T10", "T20", "PT", "Q", "SIM", "ARG", "ERA"]
ignore = [
    "ARG001",  # Unused function argument - common in Django views/handlers
    "ANN401",  # Allow Any in Django model save method *args, **kwargs
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "ANN", "COM"]
"*/tests/*.py" = ["ARG002"]  # Pytest fixtures are injected via parameter names
"scripts/*.py" = ["T201"]  # CLI scripts need print for output
"curation/*.py" = ["T201"]  # CLI scripts need print for output

[tool.ruff.lint.isort]
known-first-party = ["terramedic"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "terramedic.core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--cov=terramedic",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-fail-under=33",
]

[tool.coverage.run]
source = ["terramedic"]
omit = [
    "**/migrations/*",
    "**/tests/*",
    "**/tests.py",
    "**/test_*.py",
    "**/*_tests.py",
    "**/management/commands/*",
    "terramedic/core/settings.py",
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "terramedic.organizations.models"
disable_error_code = ["var-annotated", "no-any-return", "django-manager-missing"]

[[tool.mypy.overrides]]
module = "terramedic.organizations.models.*"
disable_error_code = ["var-annotated", "no-any-return", "django-manager-missing"]

[[tool.mypy.overrides]]
module = "terramedic.nominations.models"
disable_error_code = ["var-annotated", "no-any-return", "django-manager-missing"]

[tool.django-stubs]
django_settings_module = "terramedic.core.settings"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
