services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=terramedic.core.settings
      - SECRET_KEY=local-dev-secret-key-not-for-production
      - DEBUG=true
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - SPATIALITE_LIBRARY_PATH=mod_spatialite
    volumes:
      - backend-data:/app/data

volumes:
  backend-data:
